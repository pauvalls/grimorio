schema: spec-driven

context: |
  Tech stack: Go 1.24, MCP server (mark3labs/mcp-go)
  Architecture: Clean architecture (internal/, cmd/), MCP handlers, compiler (HTML/PDF)
  Testing: go test (built-in) with race detection and coverage
  Style: golangci-lint (configured in Makefile), gofmt
  PDF Engine: wkhtmltopdf
  Campaign format: Markdown files (lore, acts, npcs, bestiary, encounters, maps)

strict_tdd: true

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected agents, templates, and compiler components
    - Document breaking changes for v1.x campaigns
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Reference WotC format (WDH) as quality benchmark
  design:
    - Include sequence diagrams for agent interactions
    - Document architecture decisions with rationale
    - Specify backward compatibility strategy
  tasks:
    - Group tasks by phase (agents, templates, compiler, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing Go patterns and conventions
    - Load relevant coding skills for Go projects
    - Maintain MCP handler compatibility
  verify:
    - Run `make test` before marking complete
    - Compare generated output against WDH metrics
    - Validate cross-references between components
  archive:
    - Warn before merging destructive deltas (large removals)
    - Document migration path from v1.x to v2.0

testing:
  strict_tdd: true
  runner:
    command: go test -v -race -coverprofile=coverage.out $$(go list ./... | grep -v '/cmd/')
    framework: go test
  layers:
    unit:
      available: true
      tool: go test
    integration:
      available: true
      tool: go test + httptest
    e2e:
      available: false
      tool: —
  coverage:
    available: true
    command: go test -coverprofile=coverage.out
  quality:
    linter:
      available: true
      command: golangci-lint run --timeout=5m ./...
      note: Configured in Makefile, may need local installation
    type_checker:
      available: true
      command: go vet ./...
    formatter:
      available: true
      command: gofmt -w .
