<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <pattern id="stone" patternUnits="userSpaceOnUse" width="20" height="20">
      <rect width="20" height="20" fill="#2a2a2a"/>
      <path d="M0 0 L20 0 M0 10 L20 10 M0 0 L0 20" stroke="#3a3a3a" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#1a1a2e"/>
  
  <!-- River -->
  <path d="M 200 0 Q 250 200 180 400 Q 150 500 200 600" fill="none" stroke="#4a6fa5" stroke-width="40" opacity="0.6"/>
  <path d="M 200 0 Q 250 200 180 400 Q 150 500 200 600" fill="none" stroke="#6a9fd5" stroke-width="20" opacity="0.4"/>
  
  <!-- City Wall -->
  <rect x="50" y="50" width="700" height="500" fill="none" stroke="#5a5a5a" stroke-width="8" rx="10"/>
  <rect x="60" y="60" width="680" height="480" fill="none" stroke="#3a3a3a" stroke-width="4" rx="8"/>
  
  <!-- North Side - Crown District -->
  <rect x="100" y="80" width="300" height="180" fill="url(#stone)" stroke="#666" stroke-width="2"/>
  <text x="250" y="100" text-anchor="middle" fill="#c9a84c" font-family="serif" font-size="14" font-weight="bold">SECTOR NORTE</text>
  
  <!-- Palace -->
  <rect x="150" y="120" width="120" height="80" fill="#3a2a1a" stroke="#c9a84c" stroke-width="3"/>
  <rect x="180" y="100" width="60" height="40" fill="#2a1a0a" stroke="#c9a84c" stroke-width="2"/>
  <text x="210" y="165" text-anchor="middle" fill="#c9a84c" font-family="serif" font-size="10">Palacio de</text>
  <text x="210" y="178" text-anchor="middle" fill="#c9a84c" font-family="serif" font-size="10">la Corona</text>
  
  <!-- Council Tower -->
  <polygon points="320,200 340,120 360,200" fill="#1a1a2a" stroke="#c9a84c" stroke-width="2"/>
  <text x="340" y="190" text-anchor="middle" fill="#c9a84c" font-family="serif" font-size="9">Torre del</text>
  <text x="340" y="200" text-anchor="middle" fill="#c9a84c" font-family="serif" font-size="9">Concilio</text>
  
  <!-- South Side - Merchant/Slums -->
  <rect x="100" y="320" width="300" height="200" fill="#2a2a2a" stroke="#666" stroke-width="2"/>
  <text x="250" y="340" text-anchor="middle" fill="#c9a84c" font-family="serif" font-size="14" font-weight="bold">SECTOR SUR</text>
  
  <!-- Harbor -->
  <rect x="120" y="360" width="100" height="60" fill="#3a3a4a" stroke="#4a6fa5" stroke-width="2"/>
  <text x="170" y="395" text-anchor="middle" fill="#8ab4f8" font-family="serif" font-size="10">Puerto</text>
  <text x="170" y="408" text-anchor="middle" fill="#8ab4f8" font-family="serif" font-size="10">Fluvial</text>
  
  <!-- Shadow Alley -->
  <rect x="260" y="420" width="80" height="40" fill="#0a0a0a" stroke="#444" stroke-width="2"/>
  <text x="300" y="445" text-anchor="middle" fill="#666" font-family="serif" font-size="9">Callejón</text>
  <text x="300" y="455" text-anchor="middle" fill="#666" font-family="serif" font-size="9">Sombras</text>
  
  <!-- Pact Temple -->
  <rect x="420" y="400" width="80" height="80" fill="#2a1a0a" stroke="#c9a84c" stroke-width="2"/>
  <polygon points="460,380 440,400 480,400" fill="#1a0a0a" stroke="#c9a84c" stroke-width="2"/>
  <text x="460" y="445" text-anchor="middle" fill="#c9a84c" font-family="serif" font-size="9">Templo</text>
  <text x="460" y="458" text-anchor="middle" fill="#c9a84c" font-family="serif" font-size="9">del Pacto</text>
  
  <!-- Bridges -->
  <rect x="180" y="280" width="60" height="20" fill="#5a4a3a" stroke="#8a7a6a" stroke-width="2"/>
  <rect x="280" y="280" width="60" height="20" fill="#5a4a3a" stroke="#8a7a6a" stroke-width="2"/>
  <rect x="380" y="280" width="60" height="20" fill="#5a4a3a" stroke="#8a7a6a" stroke-width="2"/>
  
  <!-- Gate Houses -->
  <rect x="45" y="270" width="25" height="40" fill="#4a4a4a" stroke="#666"/>
  <rect x="730" y="270" width="25" height="40" fill="#4a4a4a" stroke="#666"/>
  <rect x="380" y="45" width="40" height="25" fill="#4a4a4a" stroke="#666"/>
  <rect x="380" y="530" width="40" height="25" fill="#4a4a4a" stroke="#666"/>
  
  <!-- Ash falling from north -->
  <g opacity="0.3">
    <circle cx="100" cy="50" r="2" fill="#888"/>
    <circle cx="200" cy="80" r="1.5" fill="#888"/>
    <circle cx="300" cy="40" r="2" fill="#888"/>
    <circle cx="400" cy="70" r="1" fill="#888"/>
    <circle cx="500" cy="90" r="2" fill="#888"/>
    <circle cx="150" cy="120" r="1.5" fill="#888"/>
    <circle cx="250" cy="100" r="2" fill="#888"/>
    <circle cx="350" cy="130" r="1" fill="#888"/>
  </g>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" fill="#c9a84c" font-family="serif" font-size="20" font-weight="bold">VELDORN, LA CAPITAL</text>
  <text x="400" y="580" text-anchor="middle" fill="#888" font-family="serif" font-size="10">Pacto de Cenizas - Mapa de Ciudad</text>
</svg>