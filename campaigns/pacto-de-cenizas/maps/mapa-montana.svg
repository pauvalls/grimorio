<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="800" height="700">
  <!-- Background -->
  <rect width="800" height="700" fill="#1a0a0a"/>
  
  <!-- Ash clouds -->
  <ellipse cx="400" cy="200" rx="300" ry="100" fill="#2a1a1a" opacity="0.6"/>
  <ellipse cx="200" cy="150" rx="150" ry="60" fill="#3a2a2a" opacity="0.4"/>
  <ellipse cx="600" cy="180" rx="180" ry="70" fill="#3a2a2a" opacity="0.4"/>
  
  <!-- Mountain silhouette -->
  <polygon points="400,50 200,400 100,650 700,650 600,400" fill="#1a1a1a" stroke="#3a2a2a" stroke-width="3"/>
  <polygon points="400,80 250,380 180,600 620,600 550,380" fill="#0a0a0a" stroke="#2a1a1a" stroke-width="2"/>
  
  <!-- Lava veins -->
  <path d="M 350 200 Q 380 300 360 400" fill="none" stroke="#8a2a2a" stroke-width="4" opacity="0.7"/>
  <path d="M 450 220 Q 420 320 440 420" fill="none" stroke="#8a2a2a" stroke-width="3" opacity="0.6"/>
  <path d="M 300 350 Q 340 450 320 550" fill="none" stroke="#6a1a1a" stroke-width="3" opacity="0.5"/>
  <path d="M 500 380 Q 460 480 480 580" fill="none" stroke="#6a1a1a" stroke-width="2" opacity="0.5"/>
  
  <!-- The Hundred Path -->
  <path d="M 400 650 Q 400 550 380 450 Q 360 350 380 250 Q 400 150 400 100" fill="none" stroke="#5a4a3a" stroke-width="8" stroke-dasharray="15,5"/>
  <text x="420" y="500" fill="#8a7a6a" font-family="serif" font-size="11">Sendero de los Cien</text>
  
  <!-- Statues -->
  <g fill="#4a4a4a" stroke="#5a5a5a" stroke-width="1">
    <rect x="370" y="580" width="8" height="20"/>
    <rect x="390" y="560" width="8" height="20"/>
    <rect x="410" y="540" width="8" height="20"/>
    <rect x="430" y="520" width="8" height="20"/>
    <rect x="360" y="500" width="8" height="20"/>
    <rect x="380" y="480" width="8" height="20"/>
    <rect x="400" y="460" width="8" height="20"/>
    <rect x="420" y="440" width="8" height="20"/>
    <rect x="350" y="420" width="8" height="20"/>
    <rect x="370" y="400" width="8" height="20"/>
  </g>
  
  <!-- Sealed Gate -->
  <rect x="360" y="80" width="80" height="40" fill="#2a1a0a" stroke="#c9a84c" stroke-width="3"/>
  <text x="400" y="105" text-anchor="middle" fill="#c9a84c" font-family="serif" font-size="11">Puerta Sellada</text>
  
  <!-- Seal glow -->
  <circle cx="400" cy="100" r="50" fill="none" stroke="#c9a84c" stroke-width="2" opacity="0.3"/>
  <circle cx="400" cy="100" r="40" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.2"/>
  
  <!-- Pact Chamber -->
  <ellipse cx="400" cy="50" rx="60" ry="30" fill="#0a0a0a" stroke="#8a2a2a" stroke-width="3"/>
  <text x="400" y="55" text-anchor="middle" fill="#8a3a3a" font-family="serif" font-size="10">Cámara del Pacto</text>
  
  <!-- Blacksmith Refuge -->
  <rect x="150" y="500" width="60" height="40" fill="#1a1a1a" stroke="#666" stroke-width="2"/>
  <rect x="160" y="480" width="40" height="20" fill="#0a0a0a" stroke="#444" stroke-width="1"/>
  <text x="180" y="525" text-anchor="middle" fill="#888" font-family="serif" font-size="9">Refugio del</text>
  <text x="180" y="535" text-anchor="middle" fill="#888" font-family="serif" font-size="9">Herrero</text>
  
  <!-- Fire from chimney -->
  <polygon points="170,480 175,460 180,480" fill="#8a3a1a" opacity="0.7"/>
  <polygon points="180,480 185,465 190,480" fill="#8a3a1a" opacity="0.5"/>
  
  <!-- Fire Rift -->
  <ellipse cx="650" cy="450" rx="40" ry="20" fill="#8a2a1a" stroke="#c9a84c" stroke-width="2" opacity="0.8"/>
  <text x="650" y="455" text-anchor="middle" fill="#c9a84c" font-family="serif" font-size="10">Grieta del Fuego</text>
  
  <!-- Guardian Crypt -->
  <rect x="600" y="300" width="50" height="30" fill="#1a1a2a" stroke="#4a4a6a" stroke-width="2"/>
  <text x="625" y="320" text-anchor="middle" fill="#6a6a8a" font-family="serif" font-size="9">Cripta</text>
  
  <!-- Ash particles -->
  <g fill="#666" opacity="0.5">
    <circle cx="200" cy="100" r="2"/>
    <circle cx="300" cy="150" r="1.5"/>
    <circle cx="500" cy="120" r="2"/>
    <circle cx="600" cy="200" r="1"/>
    <circle cx="150" cy="300" r="2"/>
    <circle cx="650" cy="350" r="1.5"/>
    <circle cx="250" cy="250" r="1"/>
    <circle cx="550" cy="280" r="2"/>
    <circle cx="350" cy="180" r="1.5"/>
    <circle cx="450" cy="220" r="1"/>
  </g>
  
  <!-- Title -->
  <text x="400" y="680" text-anchor="middle" fill="#c9a84c" font-family="serif" font-size="18" font-weight="bold">MONTAÑA DE CENIZAS</text>
  <text x="400" y="695" text-anchor="middle" fill="#888" font-family="serif" font-size="10">Pacto de Cenizas - Mapa de Mazmorra</text>
</svg>